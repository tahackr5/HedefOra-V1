name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  quality:
    name: W000 quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit identity
        shell: bash
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_checkout_sha="$(git rev-parse HEAD)"
          if [[ "${actual_checkout_sha}" != "${EXPECTED_CHECKOUT_SHA}" ]]; then
            echo "::error::Checked-out SHA ${actual_checkout_sha} does not match expected ${EXPECTED_CHECKOUT_SHA}."
            exit 1
          fi
          {
            echo "### W000 source identity"
            echo "- Checked-out SHA: ${actual_checkout_sha}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "- Pull request event merge SHA: ${GITHUB_SHA}"
            else
              echo "- Push event SHA: ${GITHUB_SHA}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Scan committed source for secrets
        shell: bash
        run: |
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact --no-banner --no-color

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: false
          go-version-file: go.mod

      - name: Check tracked Go formatting
        shell: bash
        run: |
          set -euo pipefail
          tracked_go_files="$(mktemp "${RUNNER_TEMP}/hedefora-go-files.XXXXXX")"
          trap 'rm -f "${tracked_go_files}"' EXIT
          git ls-files -z -- '*.go' > "${tracked_go_files}"
          mapfile -d '' go_files < "${tracked_go_files}"
          if ((${#go_files[@]} == 0)); then
            echo "::error::No tracked Go files found."
            exit 1
          fi
          for index in "${!go_files[@]}"; do
            go_files[index]="./${go_files[index]}"
          done
          if ! unformatted="$(gofmt -l "${go_files[@]}")"; then
            echo "::error::gofmt failed."
            exit 1
          fi
          if [[ -n "${unformatted}" ]]; then
            echo "::error::Tracked Go files are not gofmt-formatted."
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Validate immutable ownership ranges
        shell: bash
        run: |
          set -euo pipefail
          ownership_args=(
            -manifest state/W000-OWNERSHIP.json
            -all
            -base 2efca6c8b65e3342ad5309076b7cd0dedf816943
            -head HEAD
          )
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            ownership_args+=(-merge-wrapper)
          fi
          go run ./tools/repolint/cmd/repolint "${ownership_args[@]}"

      - name: Set up pnpm and Node.js from package.json
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: false
          install: false

      - name: Record runner and tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### W000 CI environment"
            echo "- Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- Image OS: ${ImageOS:-unknown}"
            echo "- Image version: ${ImageVersion:-unknown}"
            echo "- Go: $(go env GOVERSION)"
            echo "- Python: $(python3 --version)"
            echo "- Node.js: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate repository-owned TOML
        run: python3 scripts/validate_toml.py

      - name: Test TOML validator
        run: python3 -m unittest scripts/test_validate_toml.py

      - name: Install JavaScript dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript and repository checks
        run: pnpm ci:check

      - name: Verify Go modules
        run: go mod verify

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
