name: CI

on:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  r016-source-boundary:
    name: R-016 first-party source boundary
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject non-HedefOra repository execution
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_REPOSITORY_FULL_NAME: ${{ github.repository }}
          EVENT_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "${EVENT_NAME}" == "push" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "1349011765" ]]
          [[ "${EVENT_REPOSITORY_FULL_NAME}" == "tahackr5/HedefOra-V1" ]]
          [[ "${EVENT_REPOSITORY_VISIBILITY}" == "public" || "${EVENT_REPOSITORY_VISIBILITY}" == "private" ]]
          [[ "${EVENT_DEFAULT_BRANCH}" == "main" ]]

  quality:
    name: W001 quality gates
    needs: r016-source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit identity
        shell: bash
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_checkout_sha="$(git rev-parse HEAD)"
          if [[ "${actual_checkout_sha}" != "${EXPECTED_CHECKOUT_SHA}" ]]; then
            echo "::error::Checked-out SHA ${actual_checkout_sha} does not match expected ${EXPECTED_CHECKOUT_SHA}."
            exit 1
          fi
          {
            echo "### W001 source identity"
            echo "- Checked-out SHA: ${actual_checkout_sha}"
            echo "- Push event SHA: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Scan committed source for secrets
        shell: bash
        run: |
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact --no-banner --no-color

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          check-latest: false
          go-version-file: go.mod

      - name: Check tracked Go formatting
        shell: bash
        run: |
          set -euo pipefail
          tracked_go_files="$(mktemp "${RUNNER_TEMP}/hedefora-go-files.XXXXXX")"
          trap 'rm -f "${tracked_go_files}"' EXIT
          git ls-files -z -- '*.go' > "${tracked_go_files}"
          mapfile -d '' go_files < "${tracked_go_files}"
          if ((${#go_files[@]} == 0)); then
            echo "::error::No tracked Go files found."
            exit 1
          fi
          for index in "${!go_files[@]}"; do
            go_files[index]="./${go_files[index]}"
          done
          if ! unformatted="$(gofmt -l "${go_files[@]}")"; then
            echo "::error::gofmt failed."
            exit 1
          fi
          if [[ -n "${unformatted}" ]]; then
            echo "::error::Tracked Go files are not gofmt-formatted."
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Validate immutable W000 history
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code \
            bde560f182032e1e4ec9f1a1b02db4cd8ec5e99b \
            HEAD \
            -- \
            state/W000-EVIDENCE.md \
            state/W000-OWNERSHIP.json \
            state/W000-OWNERSHIP.md
          historical_args=(
            -manifest state/W000-OWNERSHIP.json
            -all
            -base 2efca6c8b65e3342ad5309076b7cd0dedf816943
            -head bde560f182032e1e4ec9f1a1b02db4cd8ec5e99b
            -merge-wrapper
          )
          go run ./tools/repolint/cmd/repolint "${historical_args[@]}"

      - name: Validate immutable W001 ownership ranges
        shell: bash
        run: |
          set -euo pipefail
          ownership_args=(
            -manifest state/W001-OWNERSHIP.json
            -all
            -base bde560f182032e1e4ec9f1a1b02db4cd8ec5e99b
            -head HEAD
          )
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ownership_args+=(-merge-wrapper)
          fi
          go run ./tools/repolint/cmd/repolint "${ownership_args[@]}"

      - name: Set up pnpm and Node.js from package.json
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: false
          install: false

      - name: Record runner and tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### W001 CI environment"
            echo "- Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- Image OS: ${ImageOS:-unknown}"
            echo "- Image version: ${ImageVersion:-unknown}"
            echo "- Go: $(go env GOVERSION)"
            echo "- Python: $(python3 --version)"
            echo "- Node.js: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate repository-owned TOML
        run: python3 scripts/validate_toml.py

      - name: Test TOML validator
        run: python3 -m unittest scripts/test_validate_toml.py

      - name: Install JavaScript dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript and repository checks
        run: pnpm ci:check

      - name: Verify Go modules
        run: go mod verify

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

  supply-chain:
    name: R-016 supply-chain gate
    if: github.event_name == 'push'
    needs: r016-source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit identity
        shell: bash
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_checkout_sha="$(git rev-parse HEAD)"
          if [[ "${actual_checkout_sha}" != "${EXPECTED_CHECKOUT_SHA}" ]]; then
            echo "::error::Checked-out SHA ${actual_checkout_sha} does not match expected ${EXPECTED_CHECKOUT_SHA}."
            exit 1
          fi
          echo "### R-016 source: ${actual_checkout_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up exact trusted Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
          check-latest: false
          package-manager-cache: false

      - name: Run pinned R-016 gate
        id: r016
        shell: bash
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          R016_AUTHORITY: github-context-claim
          R016_VISIBILITY_PROOF: "false"
          R016_EVENT_NAME: push
          R016_BASE_REPOSITORY_ID: ${{ github.event.repository.id }}
          R016_BASE_REPOSITORY_FULL_NAME: ${{ github.repository }}
          R016_BASE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          R016_TARGET_REPOSITORY_ID: ${{ github.event.repository.id }}
          R016_TARGET_REPOSITORY_FULL_NAME: ${{ github.repository }}
          R016_TARGET_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          R016_TARGET_REPOSITORY_FORK: "false"
          R016_REPOSITORY_RELATION: same-repository
        run: |
          set -euo pipefail
          trusted_tool_cache="$(realpath "${RUNNER_TOOL_CACHE}")"
          node_entry="$(command -v node)"
          node_binary="$(realpath "${node_entry}")"
          [[ "${node_binary}" == "${trusted_tool_cache}/"* ]]
          [[ -f "${node_binary}" && -x "${node_binary}" ]]
          [[ "$("${node_binary}" --version)" == "v24.20.0" ]]
          [[ -x /usr/bin/git ]]
          [[ -x /usr/bin/docker ]]
          if [[ -e artifacts/r016 ]]; then
            echo "::error::artifacts/r016 must not exist before the trusted gate starts."
            exit 1
          fi
          set +e
          gate_output="$("${node_binary}" scripts/supply-chain/run.mjs 2>&1)"
          gate_exit=$?
          set -e
          printf '%s\n' "${gate_output}"
          mapfile -d '' artifact_directories < <(
            find artifacts/r016 -mindepth 1 -maxdepth 1 -type d -print0
          )
          [[ "${#artifact_directories[@]}" -eq 1 ]]
          artifact_path="$(realpath "${artifact_directories[0]}")"
          repository_path="$(realpath .)"
          [[ "${artifact_path}" == "${repository_path}/artifacts/r016/"* ]]
          evidence_count=0
          for evidence_name in evidence.json evidence-finalization-failure.json; do
            evidence_path="${artifact_path}/${evidence_name}"
            if [[ -e "${evidence_path}" || -L "${evidence_path}" ]]; then
              [[ -f "${evidence_path}" && ! -L "${evidence_path}" ]]
              evidence_count=$((evidence_count + 1))
            fi
          done
          [[ "${evidence_count}" -eq 1 ]]
          if find "${artifact_path}" -type l -print -quit | grep -q .; then
            echo "::error::R-016 artifact directory contains a symbolic link."
            exit 1
          fi
          artifact_relative="artifacts/r016/$(basename "${artifact_path}")"
          printf 'artifact_path=%s\n' "${artifact_relative}" >> "${GITHUB_OUTPUT}"
          exit "${gate_exit}"

      - name: Upload R-016 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r016-${{ github.sha }}
          path: ${{ steps.r016.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
