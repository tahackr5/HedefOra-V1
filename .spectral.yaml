extends:
  - spectral:oas

# W000 has no public/runtime API endpoint, legal entity or license decision yet.
# These three metadata rules become applicable when W001 introduces operations.
rules:
  info-contact: off
  info-license: off
  oas3-api-servers: off
  w000-no-path-operations:
    description: W000 must not define HTTP operations.
    severity: error
    given: $.paths
    then:
      function: length
      functionOptions:
        max: 0
  w000-no-webhook-operations:
    description: W000 must not define webhook operations.
    severity: error
    given: $.webhooks
    then:
      function: length
      functionOptions:
        max: 0
