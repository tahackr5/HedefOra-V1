services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: hedefora_dev
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
      POSTGRES_PASSWORD: ${HEDEFORA_DEV_POSTGRES_PASSWORD:-local-dev-only-not-a-secret}
      POSTGRES_USER: hedefora_dev
    ports:
      - 127.0.0.1:${HEDEFORA_DEV_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

volumes:
  postgres_data:
